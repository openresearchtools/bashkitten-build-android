name: Verify public component artifact access
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  access:
    runs-on: ubuntu-24.04
    steps:
      - name: Download public BashKitten component using this builder token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/openresearchtools/bashkitten/actions/artifacts/10754662326/zip > "$RUNNER_TEMP/component.zip"
          unzip -t "$RUNNER_TEMP/component.zip"
